<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    <title>Matcha Maker</title>
    <script src="script.js" defer></script>
    
</head>
<body>

     <main class="game-container">

        <header class="game-title">
            <h1>matcha maker</h1>
            <p>Roll • Pour • Win</p>
        </header>

        <section class="controls"> 

            <div class="dice">
               <img src="images/die-1.png" alt="first die">
               <img src="images/die-2.png" alt="second die">

            </div>

            <div class="buttons">
                <button>Roll the Dice</button>
                <button>Pass</button>
            </div>

        </section>

        <section class="players">

           <!--  Barista 1 -->
            <div class="player player-1">

                <div class="main-cup">
                    <img src="images/empty.png" alt="empty cup">
                </div>
                    <h2>Barista 1</h2>
            </div>

            <!-- Barista 2 -->
             <div class="player player-2">

                    <div class="main-cup">
                        <img src="images/empty.png" alt="empty cup">
                    </div>
                <h2>Barista 2</h2>
            </div>

        </section>

        <section class="completed-cups">

            <div class="player-cups">
                <img src="images/empty.png" alt="empty cup">
                <img src="images/empty.png" alt="empty cup">
                <img src="images/empty.png" alt="empty cup">
                <img src="images/empty.png" alt="empty cup">
                <img src="images/empty.png" alt="empty cup">
            </div>

             <div class="player-cups">
                <img src="images/empty.png" alt="empty cup">
                <img src="images/empty.png" alt="empty cup">
                <img src="images/empty.png" alt="empty cup">
                <img src="images/empty.png" alt="empty cup">
                <img src="images/empty.png" alt="empty cup">
            </div>

        </section>

    </main>
    
</body>
</html>
