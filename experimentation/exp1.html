<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzz and Fizz</title>
</head>
<body>
    <h1>Experimentation 1</h1>

    <h2>This program prints the numbers from 1 to 100 while dividing the numbers by 3 or 5. If there is no remainder by 3, it prints "Fizz" and if there is no remainder by 5, it prints "Buzz".</h2>
    <script>
        /* loop */
        for(var i = 1; i <= 100; i++) {
            /* sequence */
            /* selection */
            if (i % 3 == 0) {
                console.log("Fizz")
            }
            else if (i % 5 == 0){
                console.log("Buzz")
            }
            else {
                console.log(i)
            }
        }


    </script>
</body>
</html>
