<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimentation Example</title>
</head>
<body>

    <h1>Experimentation Example</h1>

    <script>
        var sentence = "the quick brown fox jumped over the lazy dog";
        var newSentence = "";
        var capitalize = true;
        for (var i=0; i<sentence.length; i++){
            if (capitalize){
                newSentence += sentence[i].toUpperCase();
                capitalize = false;
                } else {
                    if( sentence [i] === " "){
                    capitalize = true;
                    }
                    newSentence += sentence [i];
                }
            }
        
        console.log(newSentence);
    </script>
</body>
</html>
